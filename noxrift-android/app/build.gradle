plugins { id 'com.android.application' }
android {
  namespace 'de.noxrift.app'
  compileSdk 34
  defaultConfig { applicationId 'de.noxrift.app'; minSdk 24; targetSdk 34; versionCode Integer.parseInt(System.getenv('VCODE') ?: '1'); versionName '1.' + (System.getenv('VCODE') ?: '1') }
  signingConfigs { rel { storeFile file(System.getenv('KS_FILE') ?: '../ks.jks'); storePassword System.getenv('KS_PASS') ?: ''; keyAlias 'app'; keyPassword System.getenv('KS_PASS') ?: '' } }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.rel } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
