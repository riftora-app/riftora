name: NoxRift-App bauen
on:
  push:
    branches: [main]
    paths: ['noxrift-android/**', '.github/workflows/noxrift-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: nx-apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: APK bauen
        env: { VCODE: '${{ github.run_number }}' }
        run: |
          export KS_PASS="$(openssl rand -hex 16)" KS_FILE="$RUNNER_TEMP/ks.jks"
          keytool -genkeypair -keystore "$KS_FILE" -storepass "$KS_PASS" -keypass "$KS_PASS" -alias app -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NoxRift"
          gradle -p noxrift-android assembleRelease --no-daemon
      - name: APK veröffentlichen
        run: |
          cp noxrift-android/app/build/outputs/apk/release/app-release.apk nx/noxrift.apk
          git config user.name "Riftora-Team"
          git config user.email "riftora-app@users.noreply.github.com"
          git add nx/noxrift.apk
          git commit -m "NoxRift-App aktualisiert" || exit 0
          git pull --rebase origin main
          git push origin main
