<style>

:root{--bg:#0b0716;--card:#151022;--card2:#1d1630;--line:#2a2140;--fg:#f5f3ff;--mut:#a59cc4;--v:#8b5cf6;--p:#ec4899;--o:#fb923c;--c:#22d3ee;--g:#4ade80;--r:#f87171;--grad:linear-gradient(135deg,#7c3aed,#ec4899 55%,#fb923c)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(90% 50% at 100% 0%,rgba(236,72,153,.18),transparent 60%),radial-gradient(80% 40% at 0% 20%,rgba(124,58,237,.22),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;letter-spacing:.02em}
.brand img{width:34px;height:34px;border-radius:10px}
.pills{display:flex;gap:6px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-weight:600;font-size:.9rem;display:flex;gap:5px;align-items:center}
h1{font-size:1.65rem;margin:4px 0 2px;line-height:1.15}
h2{font-size:1.1rem;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mut{color:var(--mut)}.sm{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;position:relative;overflow:hidden}
.glow{background:var(--grad);border:none;color:#fff;box-shadow:0 14px 40px rgba(236,72,153,.28)}
.glow .mut{color:rgba(255,255,255,.85)}
.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin:10px 0 6px}
.bar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,#22d3ee,#a78bfa);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.glow .bar{background:rgba(0,0,0,.2)}.glow .bar>div{background:#fff}
.big{font-size:2.1rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center}.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:16px;padding:12px}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;margin-top:2px}
.q{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card2);margin-top:8px;cursor:pointer;transition:transform .15s}
.q:active{transform:scale(.98)}
.q .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:1.3rem;background:rgba(139,92,246,.18);flex:none}
.q.done{opacity:.55}.q.done .t{text-decoration:line-through}
.xp{font-size:.78rem;font-weight:700;border-radius:999px;padding:4px 9px;background:rgba(74,222,128,.15);color:var(--g);white-space:nowrap}
.btn{border:none;border-radius:16px;padding:13px 16px;font-weight:700;cursor:pointer;background:var(--grad);color:#fff;width:100%;font-size:1rem;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}.btn.sec{background:var(--card2);border:1px solid var(--line)}.btn.mini{width:auto;padding:8px 12px;font-size:.85rem;border-radius:12px}
.btn.ok{background:linear-gradient(135deg,#16a34a,#4ade80)}.btn.no{background:linear-gradient(135deg,#b91c1c,#f87171)}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0;outline:none}
input:focus,select:focus{border-color:var(--v);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--v);border-color:var(--v);color:#fff}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.item .t{font-weight:600}.item .s{font-size:.8rem;color:var(--mut)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.plus{color:var(--g)}.minus{color:var(--r)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(456px,calc(100% - 24px));background:rgba(21,16,34,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;display:flex;padding:6px;z-index:20;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.nav button{flex:1;background:none;border:none;padding:8px 2px;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--mut)}
.nav button span{font-size:1.3rem}
.nav button.on{background:var(--card2);color:#fff}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(92px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:none;background:var(--grad);color:#fff;font-size:2rem;box-shadow:0 12px 30px rgba(236,72,153,.45);cursor:pointer;z-index:21}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:26px 26px 0 0;width:min(480px,100%);padding:18px 16px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow:auto}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:10px 16px;font-weight:600;z-index:50;animation:pop .35s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
@keyframes pop{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--card2);border-radius:16px;padding:12px 6px;text-align:center;font-size:.75rem}
.badge .e{font-size:1.8rem;display:block;margin-bottom:4px}
.badge.lock{opacity:.35;filter:grayscale(1)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px;margin-top:8px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:.7rem;color:var(--mut)}
.week i{display:block;width:100%;border-radius:8px;background:linear-gradient(180deg,#22d3ee,#8b5cf6);min-height:4px}
.timer{font-size:3.4rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.ring{width:170px;height:170px;margin:0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .timer{position:absolute;inset:0;display:grid;place-items:center;font-size:2.2rem;margin:0}
.ob{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.ob .logo{width:96px;height:96px;border-radius:28px;margin:0 auto 18px;display:block;box-shadow:0 20px 50px rgba(236,72,153,.35)}
.emo{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.emo button{font-size:1.6rem;background:var(--card2);border:2px solid transparent;border-radius:14px;padding:6px 0;cursor:pointer}
.emo button.on{border-color:var(--p)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;border-radius:999px;padding:3px 8px;background:rgba(34,211,238,.15);color:var(--c)}
.tag.soon{background:rgba(251,146,60,.15);color:var(--o)}
.tog{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.tog:first-of-type{border-top:none}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;border:none;cursor:pointer;flex:none;transition:background .2s}.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}.sw.on{background:var(--v)}.sw.on::after{left:23px}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.area{background:var(--card2);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:left;cursor:pointer}.area.on{border-color:var(--v);background:rgba(139,92,246,.14)}.area b{display:block;font-size:1.05rem;margin-top:4px}.area .e{font-size:1.7rem}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.th{border:2px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;cursor:pointer;background:var(--card2);font-size:.8rem}.th.on{border-color:#fff}.th i{display:block;height:34px;border-radius:10px;margin-bottom:6px}
.steps .q .ic{background:rgba(34,211,238,.15)}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 14px}.dots i{width:8px;height:8px;border-radius:9px;background:var(--line)}.dots i.on{width:22px;background:var(--grad)}
.empty{text-align:center;color:var(--mut);padding:18px 6px;font-size:.9rem}
:focus-visible{outline:3px solid #a78bfa;outline-offset:2px;border-radius:12px}
button,[role=button]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pill.warn{border-color:#fb923c;background:rgba(251,146,60,.15);animation:pulsw 1.8s ease-in-out infinite}@keyframes pulsw{50%{box-shadow:0 0 0 5px rgba(251,146,60,.25)}}
.mini2{border-color:#22d3ee}
.offline-bar{position:fixed;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:55;background:#1f2937;border:1px solid #f59e0b;color:#fde68a;border-radius:14px;padding:10px 14px;font-size:.9rem;text-align:center}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
a{color:var(--c)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.boss{background:linear-gradient(135deg,#2a0f1f,#1d1630);border-color:#7f1d1d}
.boss.tot{border-color:#16a34a;background:linear-gradient(135deg,#0f2a1a,#1d1630)}
.bossic{font-size:2.6rem;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:rgba(255,255,255,.06);animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.05)}}
@media (prefers-reduced-motion:reduce){.bossic{animation:none}}
.pass{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.stufe{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:8px 2px;color:var(--mut);font:inherit;font-size:.62rem;line-height:1.2;cursor:default;min-height:86px}
.stufe.frei{border-color:#facc15;color:var(--fg);cursor:pointer;box-shadow:0 0 0 2px rgba(250,204,21,.25);animation:pls 1.6s infinite}
.stufe.geholt{border-color:#16a34a;color:var(--fg);animation:none;box-shadow:none;cursor:default}
@keyframes pls{50%{box-shadow:0 0 0 5px rgba(250,204,21,.12)}}
.badge.s1{box-shadow:inset 0 0 0 2px #b87333}.badge.s2{box-shadow:inset 0 0 0 2px #c0c0c0}.badge.s3{box-shadow:inset 0 0 0 2px #facc15;background:linear-gradient(160deg,#3a2a05,var(--card2))}
.karte{background:var(--card2);border:1px solid var(--line);border-radius:22px;padding:22px 16px;min-height:170px;text-align:center;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.karte .kv{font-size:1.25rem;font-weight:700;margin-top:10px}
.karte .kr{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);font-size:1.1rem;color:#a5f3fc}
.karte.auf{border-color:var(--v)}
.glaeser{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.glas{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:1.3rem;cursor:pointer}
.glas.voll{background:rgba(34,211,238,.14);border-color:#22d3ee}
.tipps{background:var(--card2);border-radius:14px;margin:8px 0;padding:2px 12px}
.tipps summary{cursor:pointer;font-weight:600;padding:10px 0;list-style:none}
.tipps summary::-webkit-details-marker{display:none}
.tipps summary::after{content:'＋';float:right;color:var(--mut)}.tipps[open] summary::after{content:'－'}
.tipps ul{margin:0 0 10px;padding-left:18px;color:var(--mut);font-size:.9rem;line-height:1.5}
.btn:disabled,.chip:disabled{opacity:.45;cursor:not-allowed}
a.btn{display:block}
:root[data-hell]{--bg:#f6f4fb;--card:#ffffff;--card2:#f1edf8;--line:#e2daf0;--fg:#1b1430;--mut:#6a6286}
:root[data-hell] body{background:radial-gradient(90% 50% at 100% 0%,rgba(236,72,153,.10),transparent 60%),radial-gradient(80% 40% at 0% 20%,rgba(124,58,237,.10),transparent 60%),var(--bg)}
:root[data-hell] .nav{background:rgba(255,255,255,.92);box-shadow:0 12px 40px rgba(60,40,120,.15)}

:root[data-hell] .boss.tot{background:linear-gradient(135deg,#dcfce7,#fff);border-color:#86efac}
:root[data-hell] .bar{background:rgba(0,0,0,.08)}
:root[data-hell] .karte .kr{color:#0e7490}
:root[data-hell] .stufe.frei{color:var(--fg)}
:root[data-einfach] *{animation:none!important;transition:none!important}
:root[data-einfach] .btn{padding:16px 18px}
:root[data-einfach] .q{padding:14px 12px}
.ava{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;background:rgba(255,255,255,.14);margin:0 auto}
.item.ich{background:rgba(139,92,246,.14);border-radius:12px;padding-left:8px;padding-right:8px}
.ob label a{text-decoration:underline}
:root[data-hell] .btn.sec{color:var(--fg)}
:root[data-hell] .nav button.on{color:var(--fg)}
:root[data-hell] .th.on{border-color:var(--v)}
[hidden]{display:none!important}
